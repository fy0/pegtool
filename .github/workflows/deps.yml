# https://github.com/actions/go-dependency-submission
name: dependency-submission
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      # Node 24 support is on main but has not been released as a versioned tag yet.
      - uses: actions/go-dependency-submission@58a892e48687d602add5889d7aa09e32efeb19a7
        with:
          go-mod-path: go.mod
